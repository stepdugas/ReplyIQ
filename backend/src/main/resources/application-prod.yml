spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.replyiq: INFO
    org.springframework: WARN

server:
  port: ${PORT:8080}

replyiq:
  frontend-url: ${FRONTEND_URL:https://replyiq.up.railway.app}
