spring:
  application:
    name: replyiq

  datasource:
    url: jdbc:postgresql://localhost:5433/replyiq
    username: ${DB_USERNAME:stephaniedugas}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope:
              - openid
              - email
              - profile
              - https://www.googleapis.com/auth/business.manage
            redirect-uri: "{baseUrl}/api/oauth2/callback/google"

server:
  port: 8080

# App-specific config
replyiq:
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:placeholder}
    model: claude-sonnet-4-6
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:placeholder}
    price-id: ${STRIPE_PRICE_ID:placeholder}
  sendgrid:
    api-key: ${SENDGRID_API_KEY:placeholder}
  google:
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/oauth2/callback/google}
  review-poll:
    interval-minutes: 30
